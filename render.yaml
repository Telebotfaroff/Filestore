services:
  - type: web
    name: filestore-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_CHANNEL_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: filestore
      - key: FORCE_SUB_CHANNEL
        value: ""
      - key: FORCE_SUB_URL
        value: ""
      - key: PORT
        value: "3000"